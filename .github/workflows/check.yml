name: Check and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: bun run verify:root-info
      - run: bun run build
      - name: Package plugin
        run: cd xyz.brbc.youtube.iinaplugin && zip -r ../youtube-iina.iinaplgz .
      - uses: actions/upload-artifact@v4
        with:
          name: youtube-iina-plugin
          path: youtube-iina.iinaplgz
